[package]
# Cargo expects dashes for the `cargo-bench-history` binary, but its internal
# implementation crates use the short `cbh_` underscore prefix.
name = "cbh_stats"
description = "Implementation crate for cargo-bench-history - do not reference directly"
publish = true
version = "0.2.3"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Only the consumer build ships. Tests, benches, examples, and agent notes
# stay in git.
include = [
    "src/**/*",
    "README.md",
    "doc/**/*",
    "docs/**/*",
]

[lib]
# This is an implementation crate whose surface is documented on `cargo-bench-history`.
doc = false

[dev-dependencies]
criterion = { workspace = true }
mutants = { workspace = true }

[[bench]]
name = "cbh_stats_significance"
harness = false

[lints]
workspace = true

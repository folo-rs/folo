[package]
name = "crp_workspace"
description = "Workspace implementation for cargo-release-plan - do not reference directly"
publish = true
version = "0.5.12"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Cargo omits excluded benchmark targets from the published manifest; local benches stay available.
include.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.release-plan]
private-api = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "ignore::gitignore::Gitignore",
    "ignore::overrides::Override",
    "ohno::app::error::AppError",
    "ohno::enrichable::Enrichable",
    "ohno::error_ext::ErrorExt",
    "semver::Version",
    "semver::VersionReq",
    "serde_core::de::Deserialize",
    "serde_core::ser::Serialize",
    "serde_json::value::Value",
    "toml_edit::document::DocumentMut",
    "toml_edit::item::Item",
    "toml_edit::table::TableLike",
]

[lib]
doc = false

[features]
# Excludes repository creation, filesystem fixtures and native I/O scheduling support.
# Inert Git observations and the lockfile driver are available without this feature.
private-test-util = []

[dependencies]
crp_diag = { workspace = true }
ignore = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true, features = ["parse", "display", "serde"] }

[dev-dependencies]
criterion = { workspace = true }
# Integration targets use the same opt-in fixture as other component tests.
crp_workspace = { path = ".", features = ["private-test-util"] }
mutants = { workspace = true }
static_assertions = { workspace = true }
testing = { path = "../testing" }

[[bench]]
name = "crp_workspace"
harness = false

[lints]
workspace = true

[package]
# Cargo's binary-package naming convention uses dashes.
name = "cargo-release-plan"
description = "A Cargo subcommand that classifies publishable packages against their version anchors and applies increment plans"
publish = true
version = "0.4.1"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

include.workspace = true

[package.metadata.docs.rs]
all-features = true

# Keep the internal executable/test boundary limited to the implementation crate.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["crp_impl::*"]

[package.metadata.binstall]
# Prebuilt binaries are published by .github/workflows/release.yml, and these
# keys must resolve to exactly the assets that workflow uploads: cargo-binstall
# cannot derive them, because release-plz tags releases under a scheme its
# auto-detection does not know and the release matrix uses one archive format on
# every platform. Ref: docs/release-automation.md, asset-naming contract.
# `bin-dir` is spelled out because the archive has no versioned inner directory.
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.release-plan]
private-api = true

[lib]
# Rust items only connect the executable and maintainer tests; users consume the CLI.
doc = false

[dependencies]
crp_impl = { workspace = true }
mimalloc = { workspace = true }

[dev-dependencies]
ohno = { workspace = true, features = ["app-err"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
testing = { path = "../testing" }

[lints]
workspace = true

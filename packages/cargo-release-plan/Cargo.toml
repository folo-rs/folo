[package]
# Cargo's binary-package naming convention uses dashes.
name = "cargo-release-plan"
description = "A Cargo subcommand that classifies publishable packages against their version anchors and applies increment plans"
publish = true
version = "0.4.1"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

include.workspace = true

[package.metadata.docs.rs]
all-features = true

# Acknowledge only the internal wiring and actual third-party types exposed by the shell.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "clap_builder::derive::Args",
    "clap_builder::derive::CommandFactory",
    "clap_builder::derive::FromArgMatches",
    "clap_builder::derive::Parser",
    "crp_versioning::*",
    "ohno::app::error::AppError",
]

[package.metadata.binstall]
# Prebuilt binaries are published by .github/workflows/release.yml, and these
# keys must resolve to exactly the assets that workflow uploads: cargo-binstall
# cannot derive them, because package tags follow a scheme its
# auto-detection does not know and the release matrix uses one archive format on
# every platform. Ref: docs/release-automation.md, asset-naming contract.
# `bin-dir` is spelled out because the archive has no versioned inner directory.
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.release-plan]
private-api = true

[lib]
# Rust items only connect the executable and maintainer tests; users consume the CLI.
doc = false

[dependencies]
clap = { workspace = true, features = ["derive"] }
crp_diag = { workspace = true }
crp_publication = { workspace = true }
crp_versioning = { workspace = true }
crp_workspace = { workspace = true }
mimalloc = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
crp_diag = { path = "../crp_diag", features = ["private-test-util"] }
mutants = { workspace = true }
static_assertions = { workspace = true }
testing = { path = "../testing" }

[lints]
workspace = true

[package]
name = "dure"
description = "Detachable Windows console sessions that outlive the terminal"
publish = false
version = "0.1.0"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

include = ["Cargo.toml", "README.md", "docs/**/*", "src/**/*"]

[package.metadata.docs.rs]
all-features = true

# The Windows integration tests are gated behind `private-test-util`, so a default-feature build
# compiles none of them and the helper they drive looks unused. Same reason as `many_cpus`.
[package.metadata.cargo-udeps.ignore]
development = ["dure-test-helper"]

# Baseline of external types intentionally exposed in the public API. Any new
# external type here trips the check so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "clap_builder::derive::Args",
    "clap_builder::derive::CommandFactory",
    "clap_builder::derive::FromArgMatches",
    "clap_builder::derive::Parser",
    "ohno::app::error::AppError",
]

[features]
# Exposes the in-crate test support the Windows integration tests drive the real
# PAL through. Not part of the product.
private-test-util = []

# Every dependency is Windows-only because the crate itself is: a non-Windows build compiles to an
# empty stub (docs/implementation.md, "Platform gate"), so declaring them unconditionally would
# make them genuinely unused there.
[target.'cfg(windows)'.dependencies]
clap = { workspace = true, features = ["derive"] }
mimalloc = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
rand = { workspace = true, features = ["thread_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dev-dependencies]
dure-test-helper = { path = "../dure-test-helper" }
mockall = { workspace = true }
mutants = { workspace = true }
static_assertions = { workspace = true }
tempfile = { workspace = true }
testing = { path = "../testing" }

[lints]
workspace = true

[package]
name = "dure"
description = "Detachable Windows console sessions that survive SSH disconnect"
publish = false
version = "0.1.0"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

include = [
    "Cargo.toml",
    "README.md",
    "docs/**/*",
    "src/**/*",
]

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type here trips the check so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "clap_builder::derive::Args",
    "clap_builder::derive::CommandFactory",
    "clap_builder::derive::FromArgMatches",
    "clap_builder::derive::Parser",
]

[features]
# Builds the helper child used by Windows integration tests. Not part of the product.
private-test-util = []

[[bin]]
name = "dure-test-helper"
path = "src/bin/dure_test_helper.rs"
required-features = ["private-test-util"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
mimalloc = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
rand = { workspace = true, features = ["thread_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
mockall = { workspace = true }
mutants = { workspace = true }
static_assertions = { workspace = true }
tempfile = { workspace = true }
testing = { path = "../testing" }

[lints]
workspace = true

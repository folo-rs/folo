[package]
# Cargo has its own logic for naming and expects dashes for the `cargo-bench-history`
# binary, but its internal implementation crates use the short `cbh_` underscore prefix.
name = "cbh_render"
description = "Implementation crate for cargo-bench-history - do not reference directly"
publish = true
version = "0.2.28"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.cargo-udeps.ignore]
# The default-feature dependency check skips the private-test-util-gated benchmarks.
development = ["criterion", "gungraun"]

# Baseline of external types intentionally exposed in the public API. Any new
# external type must be reviewed and added explicitly.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "cbh_detect::detect::findings::AnalysisMode",
    "cbh_detect::detect::findings::BranchComparison",
    "cbh_detect::detect::findings::Finding",
    "cbh_detect::detect::findings::SeriesCensus",
    "cbh_detect::detect::findings::UnjudgedReason",
    "cbh_model::comparability::DiscriminantSet",
    "serde_core::ser::Serialize",
]

[package.metadata.release-plan]
# Implementation partition of `cargo-bench-history`; consumers reach this surface
# through that package, which is where its compatibility is assessed.
private-api = true

[lib]
# This is an implementation crate whose surface is documented on `cargo-bench-history`.
doc = false

[features]
# Shared in-workspace benchmark fixtures, never forwarded by the application shell.
# Ref: docs/impl-crate-split.md.
private-test-util = ["dep:nonempty"]

[dependencies]
cbh_detect = { workspace = true }
cbh_model = { workspace = true }
colored = { workspace = true }
nonempty = { workspace = true, optional = true }
rasciigraph = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
mutants = { workspace = true }
nonempty = { workspace = true }
static_assertions = { workspace = true }
testing = { path = "../testing" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true, features = ["default"] }

[[bench]]
name = "cbh_render_reports"
harness = false
required-features = ["private-test-util"]

[[bench]]
name = "cbh_render_reports_cg"
harness = false
required-features = ["private-test-util"]

[lints]
workspace = true

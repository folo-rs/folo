[package]
name = "crp_native"
description = "Native execution for cargo-release-plan - do not reference directly"
publish = true
version = "0.4.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.release-plan]
private-api = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["crp_diag::*", "ohno::app::error::AppError"]

[lib]
doc = false

[dependencies]
command-group = { workspace = true }
crp_diag = { workspace = true }
crp_workspace = { workspace = true }
ctrlc = { workspace = true, features = ["termination"] }
dunce = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true, features = ["parse", "display", "serde"] }

[dev-dependencies]
crp_diag = { path = "../crp_diag", features = ["private-test-util"] }
crp_workspace = { path = "../crp_workspace", features = ["private-test-util"] }
mutants = { workspace = true }
static_assertions = { workspace = true }
testing = { path = "../testing" }

[lints]
workspace = true

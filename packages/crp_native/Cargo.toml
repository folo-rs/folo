[package]
name = "crp_native"
description = "Native execution for cargo-release-plan - do not reference directly"
publish = true
version = "0.5.2"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.release-plan]
private-api = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["crp_diag::*", "ohno::app::error::AppError"]

[lib]
doc = false

[features]
private-test-util = []

[dependencies]
command-group = { workspace = true }
crp_diag = { workspace = true }
crp_workspace = { workspace = true }
ctrlc = { workspace = true, features = ["termination"] }
dunce = { workspace = true }
# Select the safe-Rust backend explicitly for the interpreter-checked archive writer.
# Cargo unifies backend features: zip/deflate or flate2 zlib features elsewhere can override it.
flate2 = { workspace = true, features = ["miniz_oxide"] }
ohno = { workspace = true, features = ["app-err"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
# ZIP/Deflate only, using a Rust backend rather than native archiver or compression libraries.
zip = { workspace = true, features = ["deflate-flate2"] }

[dev-dependencies]
criterion = { workspace = true }
crp_diag = { path = "../crp_diag", features = ["private-test-util"] }
crp_workspace = { path = "../crp_workspace", features = ["private-test-util"] }
mutants = { workspace = true }
static_assertions = { workspace = true }
testing = { path = "../testing" }

[[bench]]
name = "crp_native_archive"
harness = false
required-features = ["private-test-util"]

[lints]
workspace = true

[package]
name = "vicinal"
description = "Worker pool with configurable processor affinity"
publish = true
version = "0.2.5"

authors.workspace = true
edition.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

# Baseline of external types intentionally exposed in the public API. Cross-crate
# first-party types are listed individually by their canonical defining crate
# (many_cpus re-exports hardware and processor sets from its `many_cpus_impl` partition).
# Task errors expose ohno's diagnostic traits through their Error implementation.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "many_cpus_impl::processor_set::ProcessorSet",
    "many_cpus_impl::system_hardware::SystemHardware",
    "ohno::enrichable::Enrichable",
    "ohno::error_ext::ErrorExt",
]

[features]
default = []

[dependencies]
event-listener = { workspace = true }
events_once = { workspace = true }
fast_time = { workspace = true }
many_cpus = { workspace = true }
new_zealand = { workspace = true }
nm = { workspace = true }
ohno = { workspace = true }
pin-project = { workspace = true }
plurality = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
all_the_time = { path = "../all_the_time" }
alloc_tracker = { path = "../alloc_tracker" }
criterion = { workspace = true }
futures = { workspace = true, features = ["executor"] }
many_cpus = { path = "../many_cpus", features = ["test-util"] }
mutants = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
static_assertions = { workspace = true }
testing = { path = "../testing" }
threadpool = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[bench]]
name = "vicinal"
harness = false

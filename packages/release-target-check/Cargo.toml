[package]
name = "release-target-check"
description = "Verifies immutable main-line source snapshots for release orchestration"
publish = false
version = "0.5.0"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.cargo_check_external_types]
allowed_external_types = ["crp_publication::*", "crp_workspace::*"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.release-plan]
private-api = true

[lib]
doc = false

[dependencies]
crp_diag = { workspace = true }
crp_publication = { workspace = true }
crp_workspace = { workspace = true }
mimalloc = { workspace = true }

[dev-dependencies]
ohno = { workspace = true, features = ["app-err"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
testing = { path = "../testing" }

[lints]
workspace = true

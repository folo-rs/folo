[package]
name = "testing"
description = "Private helpers for testing and examples in Folo packages"
publish = false
version = "0.0.1-never"

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Baseline of external types intentionally exposed in the public API. Any new
# external type here trips the check so accidental exposures are caught.
# Ref: docs/external-types.md.
[package.metadata.cargo_check_external_types]
allowed_external_types = ["deranged::RangedU8"]

[lib]
doc = false

[features]
default = []

[dependencies]

[target.'cfg(windows)'.dependencies]
deranged = { workspace = true, features = ["macros"] }
windows = { workspace = true, features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }

[dev-dependencies]
mutants = { workspace = true }
static_assertions = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
new_zealand = { path = "../new_zealand" }

[lints]
workspace = true

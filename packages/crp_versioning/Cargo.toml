[package]
name = "crp_versioning"
description = "Versioning implementation for cargo-release-plan - do not reference directly"
publish = true
version = "0.5.12"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Cargo omits excluded benchmark targets from the published manifest; local benches stay available.
include.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.release-plan]
private-api = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "crp_diag::*",
    "crp_workspace::*",
    "ohno::app::error::AppError",
    "semver::Version",
    "serde_core::de::Deserialize",
    "serde_core::ser::Serialize",
    "toml_edit::document::DocumentMut",
]

[lib]
doc = false

[dependencies]
crp_diag = { workspace = true }
crp_workspace = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true, features = ["parse", "display"] }

[dev-dependencies]
criterion = { workspace = true }
crp_workspace = { path = "../crp_workspace", features = ["private-test-util"] }
mutants = { workspace = true }
static_assertions = { workspace = true }
testing = { path = "../testing" }

[[bench]]
name = "crp_versioning"
harness = false

[lints]
workspace = true

[package]
name = "crp_versioning"
description = "Versioning implementation for cargo-release-plan - do not reference directly"
publish = true
version = "0.4.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Cargo retains the explicit benchmark target in the packaged manifest.
include = ["src/**", "benches/crp_versioning.rs"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.release-plan]
private-api = true

[package.metadata.cargo-udeps.ignore]
development = ["criterion"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "crp_diag::*",
    "crp_workspace::*",
    "ohno::app::error::AppError",
    "semver::Version",
    "serde_core::de::Deserialize",
    "serde_core::ser::Serialize",
    "tempfile::file::NamedTempFile",
    "toml_edit::document::DocumentMut",
]

[lib]
doc = false

[features]
private-test-util = []

[dependencies]
crp_diag = { workspace = true }
crp_workspace = { workspace = true }
ohno = { workspace = true, features = ["app-err"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml_edit = { workspace = true, features = ["parse", "display", "serde"] }

[dev-dependencies]
criterion = { workspace = true }
crp_diag = { path = "../crp_diag", features = ["private-test-util"] }
crp_workspace = { path = "../crp_workspace", features = ["private-test-util"] }
mimalloc = { workspace = true }
mutants = { workspace = true }
static_assertions = { workspace = true }
testing = { path = "../testing" }

[[bench]]
name = "crp_versioning"
harness = false
required-features = ["private-test-util"]

[lints]
workspace = true

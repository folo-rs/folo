name: Build benchmark-history companion
description: Build a run-scoped Linux companion using the shared development environment

outputs:
  archive:
    description: Executable archive for the Ubuntu publication jobs
    value: ${{ steps.build.outputs.archive }}
  binary:
    description: Companion executable in the preparation checkout
    value: ${{ steps.build.outputs.binary }}

runs:
  using: composite
  steps:
    # Share the repository's cached toolchains, native prerequisites and development tools.
    # Ref: .github/workflows/implementation.md#benchmark-workflow-artifacts.
    - name: Setup environment
      uses: ./.github/actions/setup-environment

    - name: Build and archive companion
      id: build
      shell: pwsh
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $archive = Join-Path $env:RUNNER_TEMP 'bench-history-companion.tar.gz'
        $binary = ./scripts/bench-history/build-companion.ps1 -ArchivePath $archive
        "archive=$archive" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
        "binary=$binary" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

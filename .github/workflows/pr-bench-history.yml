name: PR Benchmark history

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions: {}

jobs:
  benchmark:
    # This selects supported work; GitHub enforces the default fork OIDC permission cap.
    # Closed events still call the shared graph so its concurrency group cancels prior work.
    # Ref: design.md#pr-benchmark-history.
    if: >-
      github.repository == 'folo-rs/folo'
      && github.event.pull_request.head.repo.full_name == github.repository
    # The shared workflow derives affected scope and frozen PR head/base; Folo supplies
    # only repository-specific settings. Ref: implementation.md#benchmark-workflow-artifacts.
    uses: folo-rs/cargo-bench-history-action/.github/workflows/pr.yml@36da42dd15209824627745c3efd78495cec035f2 # v1.1.0
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
    with:
      azure-client-id: ${{ vars.AZURE_PROD_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      exclude: benchmarks,infinity_pool
      all-features: true
      best-of: 3
      # Ref: design.md#benchmark-setup-hook.
      rustflags: -Cllvm-args=-align-all-functions=6
      install-method: path
      source-path: .

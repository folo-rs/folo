name: PR Benchmark history

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# Project/PR identity keeps unrelated PRs separate, including forks with the same branch name.
# Closing enters the group but skips all work. Ref: design.md#concurrency.
concurrency:
  group: pr-bench-history-folo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  # Match the configured Folo project and its maintained benchmark platforms.
  # Ref: design.md#benchmark-history.
  CBH_INSTANCE: folo
  CBH_PLATFORMS: ubuntu-latest,windows-latest

jobs:
  unsupported:
    if: >-
      github.repository == 'folo-rs/folo'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain unsupported fork
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host 'Benchmarking is skipped because fork pull requests are not supported. No storage credentials or GitHub posting permissions are granted.'

  prepare:
    if: >-
      github.repository == 'folo-rs/folo'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Generous cold compiler/build watchdog; preparation never runs benchmarks.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      instance: ${{ steps.matrix.outputs.instance }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      expected-platforms: ${{ steps.matrix.outputs.expected-platforms }}
      collection-job-prefix: ${{ steps.matrix.outputs.collection-job-prefix }}
    steps:
      # Automation comes from the event's merge checkout so old PR heads need not contain
      # newly introduced helpers. No benchmark is recorded against this synthetic commit.
      # Ref: implementation.md#benchmark-workflow-artifacts.
      - name: Checkout automation
        uses: actions/checkout@v7
      - name: Build companion
        id: companion
        uses: ./.github/actions/build-bench-history-companion
      - name: Resolve collection matrix
        id: matrix
        shell: pwsh
        env:
          COMPANION: ${{ steps.companion.outputs.binary }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          & $env:COMPANION --instance $env:CBH_INSTANCE workflow-matrix --platforms $env:CBH_PLATFORMS --github-output $env:GITHUB_OUTPUT
      - name: Upload companion
        uses: actions/upload-artifact@v7
        with:
          name: bench-history-companion-${{ env.CBH_INSTANCE }}
          path: ${{ steps.companion.outputs.archive }}
          if-no-files-found: error
          overwrite: true

  delta:
    if: >-
      github.repository == 'folo-rs/folo'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Includes a possible cold development-tool setup before scope calculation.
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.scope.outputs.packages }}
      skip_all: ${{ steps.scope.outputs.skip_all }}
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-environment
      - name: Checkout measured PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: benchmark-source
      # Scope is computed from the measured head versus its merge base, not from unrelated
      # commits that reached main after this branch diverged. Existing dependent expansion
      # and collection exclusions remain shared with the normal repository helpers.
      - name: Compute collection scope and validate reader configuration
        id: scope
        shell: pwsh
        working-directory: benchmark-source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/build/Delta.psm1') -Force
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/bench-history/BenchHistoryCollect.psm1') -Force
          Import-Module (Join-Path $env:GITHUB_WORKSPACE 'scripts/bench-history/AzureFederation.psm1') -Force
          $baseline = git merge-base $env:BASE_SHA $env:HEAD_SHA
          $affected = @(Invoke-CargoDelta -SkipFetch -BaselineRevision $baseline -ConfigPath (Join-Path $env:GITHUB_WORKSPACE 'delta.toml'))
          $benchmarkable = @(Select-BenchmarkablePackage -Package $affected)
          $output = Get-DeltaOutput -Affected $benchmarkable
          if ($output.SkipAll -eq 'false') {
            Set-AzureFederationEnv -ConstantsPath (Join-Path $env:GITHUB_WORKSPACE 'constants.env') -EnvFilePath $env:GITHUB_ENV -Access Reader | Out-Null
          }
          "packages=$($benchmarkable -join ',')" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "skip_all=$($output.SkipAll)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Host "Collection scope: $($benchmarkable -join ', '). Empty scope produces an explanatory comment without collecting."

  preflight:
    needs: [prepare, delta]
    if: needs.delta.outputs.skip_all == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-bench-history-comment-folo-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download companion
        uses: actions/download-artifact@v8
        with:
          name: bench-history-companion-${{ env.CBH_INSTANCE }}
          path: ${{ runner.temp }}/cbh-tools
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Signal owned benchmark work
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PACKAGES: ${{ needs.delta.outputs.packages }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'cbh-tools'
          tar -xzf (Join-Path $tools 'bench-history-companion.tar.gz') -C $tools
          & (Join-Path $tools 'cargo-bench-history-github') --instance $env:CBH_INSTANCE --verbose pr-comment-preflight --pull-request $env:PR_NUMBER --packages $env:PACKAGES --head $env:HEAD_SHA --run-id $env:GITHUB_RUN_ID

  collect:
    needs: [prepare, delta]
    if: needs.delta.outputs.skip_all == 'false'
    name: ${{ needs.prepare.outputs.collection-job-prefix }}:${{ matrix.platform }}
    concurrency:
      group: pr-bench-history-collect-${{ matrix.platform }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    # Hosted-runner maximum: the shared best-of policy repeats a long benchmark suite.
    timeout-minutes: 360
    # Benchmark code has no Azure federation and cannot post to GitHub.
    # Ref: design.md#pr-benchmark-history.
    permissions:
      contents: read
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7
      - name: Prepare benchmark environment
        uses: ./.github/actions/bench-history-setup
      - name: Checkout measured PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: benchmark-source
      - name: Collect local PR measurements
        shell: pwsh
        env:
          PACKAGES: ${{ needs.delta.outputs.packages }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $store = Join-Path $env:RUNNER_TEMP 'cbh-collection/results'
          $repository = Join-Path $env:GITHUB_WORKSPACE 'benchmark-source'
          just gh-collect-pr-bench-history $env:PACKAGES $store $repository
      - name: Record successful collection
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $directory = Join-Path $env:RUNNER_TEMP 'cbh-collection'
          $key = Join-Path $directory 'machine-key.txt'
          just gh-write-bench-history-machine-key $key
          cargo run -p cargo-bench-history-github --locked -- --instance $env:CBH_INSTANCE collection-receipt --run-id $env:GITHUB_RUN_ID --run-attempt $env:GITHUB_RUN_ATTEMPT --head $env:HEAD_SHA --platform $env:PLATFORM --machine-key-file $key --file (Join-Path $directory 'receipt.json')
      - name: Upload local collection and receipt
        uses: actions/upload-artifact@v7
        with:
          name: pr-bench-history-collection-${{ env.CBH_INSTANCE }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/cbh-collection
          if-no-files-found: error
          overwrite: true

  analyze:
    needs: [prepare, delta, collect]
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && needs.delta.result == 'success'
      && needs.delta.outputs.skip_all == 'false'
      && (needs.collect.result == 'success' || needs.collect.result == 'failure')
    runs-on: ubuntu-latest
    # Includes cold development-tool setup and reading the selected baseline.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      completed-platforms: ${{ steps.collection.outputs.completed-platforms }}
      artifact-url: ${{ steps.reports.outputs.artifact-url }}
    steps:
      - name: Checkout automation
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-environment
      - name: Checkout measured PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: benchmark-source
      - name: Configure Azure reader
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module ./scripts/bench-history/AzureFederation.psm1 -Force
          Set-AzureFederationEnv -ConstantsPath constants.env -EnvFilePath $env:GITHUB_ENV -Access Reader | Out-Null
      - name: Restore baseline cache without saving PR data
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/bench-history/cache
          key: bench-history-cache-pr-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bench-history-cache-
      # Inputs and receipts are outside the persisted cache. All-attempt downloads plus
      # job/receipt reconciliation support partial reruns without accepting stale failed-leg data.
      # Ref: implementation.md#benchmark-workflow-artifacts.
      - name: Download platform collections
        uses: actions/download-artifact@v8
        with:
          pattern: pr-bench-history-collection-${{ env.CBH_INSTANCE }}-*
          path: ${{ runner.temp }}/bench-history/collections
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Assemble validated local input
        id: collection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PLATFORMS: ${{ needs.prepare.outputs.expected-platforms }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $scratch = Join-Path $env:RUNNER_TEMP 'bench-history'
          cargo run -p cargo-bench-history-github --locked -- --instance $env:CBH_INSTANCE --verbose prepare-analysis --run-id $env:GITHUB_RUN_ID --head $env:HEAD_SHA --expected-platforms $env:EXPECTED_PLATFORMS --receipts-dir (Join-Path $scratch 'collections') --machine-key-dir (Join-Path $scratch 'keys') --local-results-dir (Join-Path $scratch 'inputs') --github-output $env:GITHUB_OUTPUT
      - name: Analyze frozen PR head against its frozen base
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $scratch = Join-Path $env:RUNNER_TEMP 'bench-history'
          just gh-analyze-bench-history $scratch (Join-Path $scratch 'keys') $env:HEAD_SHA $env:BASE_SHA (Join-Path $scratch 'inputs') (Join-Path $env:GITHUB_WORKSPACE 'benchmark-source')
      - name: Validate report evidence
        shell: pwsh
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PLATFORMS: ${{ needs.prepare.outputs.expected-platforms }}
          COMPLETED_PLATFORMS: ${{ steps.collection.outputs.completed-platforms }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo run -p cargo-bench-history-github --locked -- --instance $env:CBH_INSTANCE inspect-report --report-file (Join-Path $env:RUNNER_TEMP 'bench-history/report.json') --analyzed-sha $env:HEAD_SHA --expected-platforms $env:EXPECTED_PLATFORMS --completed-platforms $env:COMPLETED_PLATFORMS --github-output $env:GITHUB_OUTPUT
      - name: Upload analysis bundle
        id: reports
        uses: actions/upload-artifact@v7
        with:
          name: pr-bench-history-report-${{ env.CBH_INSTANCE }}
          path: |
            ${{ runner.temp }}/bench-history/report.md
            ${{ runner.temp }}/bench-history/report.json
            ${{ runner.temp }}/bench-history/summary.md
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare, delta, preflight, analyze]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.analyze.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-bench-history-comment-folo-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download companion
        uses: actions/download-artifact@v8
        with:
          name: bench-history-companion-${{ env.CBH_INSTANCE }}
          path: ${{ runner.temp }}/cbh-tools
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Download report bundle
        uses: actions/download-artifact@v8
        with:
          name: pr-bench-history-report-${{ env.CBH_INSTANCE }}
          path: ${{ runner.temp }}/cbh-report
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Publish qualified PR results
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PACKAGES: ${{ needs.delta.outputs.packages }}
          EXPECTED_PLATFORMS: ${{ needs.prepare.outputs.expected-platforms }}
          COMPLETED_PLATFORMS: ${{ needs.analyze.outputs.completed-platforms }}
          REPORT_URL: ${{ needs.analyze.outputs.artifact-url }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'cbh-tools'
          $report = Join-Path $env:RUNNER_TEMP 'cbh-report'
          tar -xzf (Join-Path $tools 'bench-history-companion.tar.gz') -C $tools
          & (Join-Path $tools 'cargo-bench-history-github') --instance $env:CBH_INSTANCE --verbose publish-pr-comment --pull-request $env:PR_NUMBER --analyzed-sha $env:HEAD_SHA --packages $env:PACKAGES --report-file (Join-Path $report 'report.json') --body-file (Join-Path $report 'summary.md') --expected-platforms $env:EXPECTED_PLATFORMS --completed-platforms $env:COMPLETED_PLATFORMS --artifact-url $env:REPORT_URL

  cleanup:
    needs: [prepare, delta]
    if: needs.delta.outputs.skip_all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-bench-history-comment-folo-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download companion
        uses: actions/download-artifact@v8
        with:
          name: bench-history-companion-${{ env.CBH_INSTANCE }}
          path: ${{ runner.temp }}/cbh-tools
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Explain empty collection scope
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'cbh-tools'
          tar -xzf (Join-Path $tools 'bench-history-companion.tar.gz') -C $tools
          & (Join-Path $tools 'cargo-bench-history-github') --instance $env:CBH_INSTANCE --verbose pr-comment-cleanup --pull-request $env:PR_NUMBER --head $env:HEAD_SHA

  finalize:
    needs: [prepare, delta, preflight, collect, analyze, publish]
    # Only the exact run/head owner can retire its placeholder. Cancellation must not leave
    # "in progress" indefinitely, but a superseding run's marker is never changed.
    if: >-
      always()
      && needs.prepare.result == 'success'
      && needs.delta.result == 'success'
      && needs.delta.outputs.skip_all == 'false'
      && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pr-bench-history-comment-folo-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download companion
        uses: actions/download-artifact@v8
        with:
          name: bench-history-companion-${{ env.CBH_INSTANCE }}
          path: ${{ runner.temp }}/cbh-tools
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Retire this run's unfinished placeholder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'cbh-tools'
          tar -xzf (Join-Path $tools 'bench-history-companion.tar.gz') -C $tools
          & (Join-Path $tools 'cargo-bench-history-github') --instance $env:CBH_INSTANCE --verbose pr-comment-finalize --pull-request $env:PR_NUMBER --head $env:HEAD_SHA --run-id $env:GITHUB_RUN_ID --run-url $env:RUN_URL

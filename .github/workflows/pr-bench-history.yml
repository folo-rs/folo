name: PR Benchmark history

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions: {}

jobs:
  configuration:
    # This selects supported work; GitHub enforces the default fork OIDC permission cap.
    # Closed events still call the shared graph so its concurrency group cancels prior work.
    # Ref: design.md#pr-benchmark-history.
    if: >-
      github.repository == 'folo-rs/folo'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      client-id: ${{ steps.values.outputs.AZURE_CLIENT_ID }}
      tenant-id: ${{ steps.values.outputs.AZURE_TENANT_ID }}
      exclude: ${{ steps.values.outputs.exclude }}
      all-features: ${{ steps.values.outputs.all-features }}
      best-of: ${{ steps.values.outputs.best-of }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read Folo configuration
        id: values
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module ./scripts/bench-history/AzureFederation.psm1 -Force
          Import-Module ./scripts/bench-history/BenchHistoryCollect.psm1 -Force
          Set-AzureFederationEnv -ConstantsPath constants.env -EnvFilePath $env:GITHUB_OUTPUT | Out-Null
          $policy = Get-BenchHistoryCollectionPolicy
          @(
            "exclude=$($policy.ExcludedPackages -join ',')"
            "all-features=$($policy.AllFeatures.ToString().ToLowerInvariant())"
            "best-of=$($policy.BestOf)"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

  benchmark:
    needs: configuration
    # The shared workflow derives affected scope and frozen PR head/base; Folo supplies
    # only repository-specific settings. Ref: implementation.md#benchmark-workflow-artifacts.
    uses: folo-rs/cargo-bench-history-action/.github/workflows/pr.yml@ca44c44315d7056472c792754b3b9009b7f6705f # v1.0.0
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: write
    with:
      azure-client-id: ${{ needs.configuration.outputs.client-id }}
      azure-tenant-id: ${{ needs.configuration.outputs.tenant-id }}
      exclude: ${{ needs.configuration.outputs.exclude }}
      all-features: ${{ fromJSON(needs.configuration.outputs.all-features) }}
      best-of: ${{ fromJSON(needs.configuration.outputs.best-of) }}
      install-method: path
      source-path: .

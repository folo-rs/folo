name: Standard validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Deep validation reuses the complete standard suite on its main-only schedule/dispatch.
  # Ref: .github/workflows/implementation.md#scheduled-standard-validation.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  # PR/push runs share ref-specific groups with the PR-close companion. Scheduled/manual callers
  # use their run ID so neither a main push nor another nightly run cancels their coverage.
  # Ref: .github/workflows/design.md#concurrency.
  group: standard-validation-${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

# Emit a backtrace whenever a test (or any Rust process) panics, so a rare flake — such as the
# alloc_tracker panic-on-next-alloc global-state race — is diagnosable straight from the failing
# run's log instead of the log only advising a re-run with RUST_BACKTRACE set. Panic messages are
# unchanged, so `#[should_panic]` matching is unaffected. Rendered `ohno` error text is not: an
# `ohno` error renders its captured backtrace as part of its `Display`, and `message()` renders an
# error's source through `Display`. Assertions on rendered error text must therefore hold with
# backtraces captured — see docs/error-handling.md.
env:
  RUST_BACKTRACE: "1"

# Least privilege by default, so standard validation does not inherit whatever
# the repository's default token scope happens to be. Jobs needing more declare it themselves; a
# job-level block replaces this default rather than adding to it.
permissions:
  contents: read

jobs:
  # Independent check steps bypass GitHub's implicit success() gate after setup succeeds.
  # Failures remain failures; cancellation and unavailable prerequisites still stop dependent work.
  # Ref: .github/workflows/design.md#job-granularity-and-gating.

  # One checkout and runner prepare both non-Cargo and Cargo validation scope.
  # Complete history supports the whole PR and release-version anchors;
  # PowerShell plans paths before setup, then Cargo impact adds native-helper test domains.
  # Ref: .github/workflows/implementation.md#non-cargo-change-planning.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      packages: ${{ steps.compute.outputs.packages }}
      packages_json: ${{ steps.compute.outputs.packages_json }}
      skip_all: ${{ steps.compute.outputs.skip_all }}
      script_domains: ${{ steps.scripts.outputs.domains }}
      release_binary_smoke: ${{ steps.scripts.outputs.release_binary_smoke }}
      benchmark_canary: ${{ steps.scripts.outputs.benchmark_canary }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan non-Cargo validation
        id: plan
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module ./scripts/build/ValidationPlan.psm1 -Force
          $eventData = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json -AsHashtable
          $plan = Get-ValidationWorkflowPlan -EventName $env:GITHUB_EVENT_NAME -EventData $eventData `
            -Ref $env:GITHUB_REF -Repository $env:GITHUB_REPOSITORY -Verbose
          "plan=$(ConvertTo-Json -InputObject $plan -Compress)" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Setup environment
        # Preparation gates package-scoped jobs and consumes the same warmed environment as
        # every other setup consumer. A cold setup may also seed environment caches for dependents;
        # this metadata-only job leaves saving workspace build artifacts to compiling jobs.
        # Ref: .github/workflows/implementation.md#shared-environment-cache-identity.
        uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "false"

      - name: Select Cargo validation scope
        id: compute
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          # The cargo-delta pipeline lives in the Pester-tested Delta module, shared with the local
          # `just delta` recipe so the two cannot drift. See scripts/build/Delta.psm1.
          Import-Module ./scripts/build/Delta.psm1 -Force

          # Only pull requests invoke delta. Push, schedule and dispatch select the whole
          # workspace without a comparison; preparation has already enforced the main-only gate.
          # Ref: .github/workflows/implementation.md#scheduled-standard-validation.
          Get-DeltaWorkflowOutput -EventName $env:GITHUB_EVENT_NAME |
            Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Include affected native helpers in script scope
        # Pester integration tests exercise real Rust helpers. Consume Cargo's dependency impact
        # instead of making every lockfile edit trigger the full script suite.
        # Ref: .github/workflows/implementation.md#non-cargo-change-planning.
        id: scripts
        shell: pwsh
        env:
          CHANGE_PLAN: ${{ steps.plan.outputs.plan }}
          AFFECTED_PACKAGES: ${{ steps.compute.outputs.packages_json }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module ./scripts/build/ValidationPlan.psm1 -Force
          $domains = @(Get-ValidationScriptDomain -PlanJson $env:CHANGE_PLAN -AffectedPackageJson $env:AFFECTED_PACKAGES -Verbose)
          "domains=$(ConvertTo-Json -InputObject $domains -Compress)" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          $smoke = Test-ReleaseBinarySmokeSelected -PlanJson $env:CHANGE_PLAN -AffectedPackageJson $env:AFFECTED_PACKAGES
          "release_binary_smoke=$($smoke.ToString().ToLowerInvariant())" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          $canary = Get-ValidationCanarySelection -PlanJson $env:CHANGE_PLAN -AffectedPackageJson $env:AFFECTED_PACKAGES -Verbose
          "check_fixture=$(ConvertTo-Json -InputObject $canary.check_fixture -Compress)" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "benchmark_canary=$(ConvertTo-Json -InputObject $canary.run_hosted -Compress)" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Verify standalone caller inputs
        # No credentials are needed: fork PRs also reject stale nested lockfiles before
        # measurement can dirty the checkout. Ref: implementation.md#reusable-workflow-canary.
        if: steps.scripts.outputs.check_fixture == 'true'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just verify-caller-fixture

  # Reuse the full caller contract, not an advisory cross-workflow status. Its result joins
  # required-checks only through this workflow's needs graph; scope/trust are reconstructed
  # by the fan-in. Ref: implementation.md#reusable-workflow-canary.
  benchmark-canary:
    needs: prepare
    if: needs.prepare.outputs.benchmark_canary == 'true'
    uses: ./.github/workflows/benchmark-action-canary.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      issues: write

  # Script tests and static analysis share setup, retaining their independent input selections.
  # An empty Cargo delta cannot discard script inputs.
  # Ref: .github/workflows/implementation.md#non-cargo-change-planning.
  test-scripts:
    needs: prepare
    if: needs.prepare.outputs.script_domains != '[]' || fromJSON(needs.prepare.outputs.plan).script_analysis || fromJSON(needs.prepare.outputs.plan).bicep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        # Selected domains may run only script/template checks, without workspace compilation.
        # Ref: implementation.md#shared-environment-cache-identity.
        id: setup
        uses: ./.github/actions/setup-environment

      - name: Validate scripts (PSScriptAnalyzer)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && fromJSON(needs.prepare.outputs.plan).script_analysis }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just validate-scripts

      # Bicep owns syntax/type/API-version checks; the shared recipe rejects warning diagnostics.
      # No Azure login or deployment occurs. Ref: .github/workflows/implementation.md#bicep-validation.
      - name: Validate Bicep templates and parameters
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && fromJSON(needs.prepare.outputs.plan).bicep }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just validate-bicep

      - name: Run script test suites
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.prepare.outputs.script_domains != '[]' }}
        shell: pwsh
        env:
          SCRIPT_DOMAINS: ${{ needs.prepare.outputs.script_domains }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $domains = @(ConvertFrom-Json -InputObject $env:SCRIPT_DOMAINS)
          just test-scripts ($domains -join ' ')

      - name: Retain script-analysis diagnostics
        # Preserve native engine/inner exceptions and file/rule context without relaxing the gate.
        # Setup failures may occur before the analyzer creates any diagnostic files.
        # Ref: docs/build-and-tooling.md#powershell-linting.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: script-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/script-analysis
          if-no-files-found: ignore

      - name: Retain Bicep diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bicep-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/bicep-validation
          if-no-files-found: ignore

  # Reuse the pinned standalone installers without restoring the Rust development environment.
  # Ref: .github/workflows/implementation.md#workflow-lint-environment.
  validate-workflows:
    needs: prepare
    if: fromJSON(needs.prepare.outputs.plan).workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-workflow-lint

      - name: Validate workflows
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          actionlint -color

  # Workspace-wide release-plan generation: every publishable package's released content
  # versus its version anchor. Delta cannot narrow that set, so this job is not gated on
  # skip_all. The shared read-only graph owns version, publication-input and API checks.
  # Ref: .github/workflows/implementation.md#release-validation.
  validate-versions:
    uses: folo-rs/cargo-release-plan-action/.github/workflows/check.yml@5d6e0ca5a279b3f84f59e91ba5c94365cef83688
    with:
      install-method: path
      source-path: .
    permissions:
      contents: read
      actions: read

  # Formatting, dev Clippy, documentation and minimum-dependency compilation share setup.
  # Documentation builds and doctests use the same platform coverage as compilation, including PRs.
  # Ref: .github/workflows/implementation.md#standard-validation-structure.
  clippy-dev-docs:
    needs: [prepare]
    if: needs.prepare.outputs.skip_all != 'true' || needs.prepare.outputs.release_binary_smoke == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "true"

      # Formatting is platform-independent; the Ubuntu leg performs the workspace-wide check.
      - name: Run format-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.prepare.outputs.skip_all != 'true' && matrix.platform == 'ubuntu-latest' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just format-check

      - name: Run clippy dev on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.prepare.outputs.skip_all != 'true' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just package="${{ needs.prepare.outputs.packages }}" clippy dev

      - name: Run docs on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.prepare.outputs.skip_all != 'true' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just package="${{ needs.prepare.outputs.packages }}" docs

      - name: Run docs-default-features on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.prepare.outputs.skip_all != 'true' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just package="${{ needs.prepare.outputs.packages }}" docs-default-features

      - name: Run test-docs on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.prepare.outputs.skip_all != 'true' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just package="${{ needs.prepare.outputs.packages }}" test-docs

      # Covers native ZIP layout/permissions on macOS as well as Linux and Windows without
      # publishing. Script-only selection must not expand the Cargo package checks above.
      # Ref: .github/workflows/implementation.md#release-binary-batches.
      - name: Smoke release binary packaging
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.prepare.outputs.release_binary_smoke == 'true' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just release-binary-smoke

      # Freezing rewrites manifests and the lockfile, so nothing using the original inputs follows.
      # Ref: .github/workflows/implementation.md#standard-validation-structure.
      - name: Run check-frozen on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.prepare.outputs.skip_all != 'true' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just package="${{ needs.prepare.outputs.packages }}" check-frozen

  # The x86_64 test pass (ubuntu-latest and windows-latest - both x86_64). Runs the full
  # test suite (unit, integration and example tests) with coverage instrumentation, so the
  # coverage report is a side effect of the regular test run rather than a second,
  # separately re-executed pass. Benchmark smoke tests and external-type checks share its setup.
  # Uploads both the coverage report and the test results to Codecov.
  #
  # macOS is deliberately not here: GitHub's `macos-latest` runner is Apple Silicon (arm64),
  # so macOS is exercised by Deep validation's `test-arm` job. Keeping this job x86_64-only keeps
  # its name accurate and stops the matrix drifting as the `-latest` labels change.
  #
  # Coverage requires the nightly toolchain (llvm-tools-preview is installed only there via
  # `just install-tools`), so this is the nightly test pass. The MSRV test pass runs on the
  # ARM runners in Deep validation, and MSRV compilation of every target is
  # covered by `check-frozen` (which compiles all targets on MSRV against the frozen minimums).
  # Paired with `test-arm`; both carry an explicit `-x64`/`-arm` suffix for symmetry.
  test-x64:
    needs: [prepare]
    if: needs.prepare.outputs.skip_all != 'true'
    # Whether a coverage report was produced at all. A delta-scoped run can measure only packages
    # that carry no instrumented code, which leaves nothing to upload and nothing for the coverage
    # notification gate to release. The matrix legs measure the same scope and write this output in
    # completion order, so the last one to finish decides. Were platform-gated code ever to make
    # them disagree, the worst case is a commit whose coverage status goes unreleased - never one
    # released off an incomplete set of uploads.
    outputs:
      coverage_report: ${{ steps.coverage.outputs.report }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        id: setup
        # The benchmark smoke check below runs every bench target once, and on Linux the
        # `*_cg` targets are real Gungraun harnesses that execute under Valgrind.
        uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "true"
          install-valgrind: "true"

      - name: Run tests with coverage on ${{ matrix.platform }}
        id: coverage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          just package="${{ needs.prepare.outputs.packages }}" coverage-measure
          just coverage-report-ci

          $report = if (Test-Path lcov.info) { 'true' } else { 'false' }
          "report=$report" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.coverage.outputs.report == 'true' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/default/junit.xml
          flags: ${{ matrix.platform }}
          report_type: test_results

      - name: Run benchmark targets on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just package="${{ needs.prepare.outputs.packages }}" test-benches

      # Unix and Windows public APIs need separate checks; macOS adds no distinct public cfg here.
      # Ref: .github/workflows/design.md#external-type-surface.
      - name: Run check-external-types on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just package="${{ needs.prepare.outputs.packages }}" check-external-types

  # Azure Blob storage backend tests against the Azurite emulator.
  #
  # The Azure backend's network paths self-skip when no
  # emulator is reachable (so the multi-platform test jobs stay green
  # without one). They run for real only here: Azurite is provisioned on the host
  # and BENCH_HISTORY_REQUIRE_AZURITE turns an unreachable emulator into a hard
  # failure, so a misconfigured emulator can never silently degrade into skipping
  # every test. This job also collects coverage so the azure.rs network paths
  # reach Codecov - the multi-platform `test-x64` job runs without an emulator and
  # therefore cannot cover them; Codecov merges this azure-flagged upload with it.
  #
  # Runs on a single platform (Linux) by choice, not by limitation: the Azure Blob
  # backend is OS-agnostic network I/O (HTTP via the azure SDK), so exercising it on
  # one platform fully covers it - also running it on Windows/macOS would only
  # duplicate the same coverage. Linux is picked because it is the cheapest/fastest
  # runner and because Azurite runs directly on the host there via npm (service
  # containers cannot reliably bind it to a reachable address). Package-gated: the
  # job is only relevant when cargo-bench-history is affected.
  #
  # Named `test-azurite` because it runs against the Azurite emulator, not a real
  # Azure account; `test-azure` covers real Azure with both credential modes.
  test-azurite:
    needs: [prepare]
    if: >-
      needs.prepare.outputs.skip_all != 'true'
      && (needs.prepare.outputs.packages == '' || contains(fromJson(needs.prepare.outputs.packages_json), 'cargo-bench-history'))
    runs-on: ubuntu-latest
    env:
      BENCH_HISTORY_REQUIRE_AZURITE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "true"
          # Only this job needs the Azurite emulator, so it is the sole opt-in; every other job
          # skips its ~3-minute npm install. The start-azurite step below then just launches it.
          install-azurite: "true"

      - name: Start Azurite
        uses: ./.github/actions/start-azurite

      - name: Generate azure coverage on ubuntu-latest
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          # Exercise adapter unit tests as well as CLI scenarios while the emulator is available.
          # Ref: .github/workflows/implementation.md#azure-emulator-coverage.
          just package="cargo-bench-history cbh_storage" coverage-measure
          just coverage-report-ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: azure
          fail_ci_if_error: true

  # The same real-Azure scenarios exercise developer credentials and self-minted GitHub OIDC
  # credentials sequentially, sharing compilation and login. Only same-repository PR/main
  # subjects can federate; fork PRs skip. Queue validation has no Azure job.
  # Azurite supplies coverage separately.
  # Ref: .github/workflows/implementation.md#real-azure-authentication.
  test-azure:
    needs: prepare
    if: >-
      needs.prepare.outputs.skip_all != 'true'
      && (needs.prepare.outputs.packages == '' || contains(fromJson(needs.prepare.outputs.packages_json), 'cargo-bench-history'))
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Both azure/login and the application's self-minting credential need GitHub OIDC access.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "true"

      # Reuse the committed identity/account values consumed by local test recipes.
      - name: Load Azure identifiers from constants.env
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Get-Content constants.env |
            Where-Object { $_ -match '^(AZURE_TEST_CLIENT_ID|AZURE_TENANT_ID|AZURE_SUBSCRIPTION_ID|BENCH_HISTORY_TEST_AZURE_ACCOUNT)=' } |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Sign in to Azure (OIDC workload identity federation)
        id: login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_TEST_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Run real-Azure storage tests via the developer credential
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        env:
          AZURE_CLIENT_ID: ""
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just test-azure

      # This step opts into the production credential; the Azure CLI login serves cleanup only.
      # Ref: .github/workflows/implementation.md#real-azure-authentication.
      - name: Run real-Azure storage tests via the self-minting OIDC credential
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        env:
          AZURE_CLIENT_ID: ${{ env.AZURE_TEST_CLIENT_ID }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just test-azure

      - name: Delete leaked test containers
        if: always()
        shell: pwsh
        # Concurrent workflow runs share the account; preserve their recently written containers.
        # Ref: .github/workflows/implementation.md#real-azure-authentication.
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./infra/azure-bench-history-test/cleanup-containers.ps1 -MinAgeMinutes 180

  # Releases Codecov's coverage notifications once every coverage upload for this
  # commit has landed.
  #
  # Coverage data arrives from several jobs: one upload per platform from the
  # `test-x64` matrix, plus a conditional `azure`-flagged upload from `test-azurite`
  # when cargo-bench-history is affected. The per-commit upload count is therefore
  # variable. codecov.yml sets `codecov.notify.manual_trigger: true`, so Codecov posts
  # NO coverage status or PR comment until this job runs the CLI `send-notifications`
  # command - which it does only after every coverage-producing job has finished. That
  # way Codecov computes the status from the complete set of uploads instead of
  # reporting a misleadingly low figure off a partial set (see codecov.yml for the
  # full rationale and why this is preferred over a hardcoded `after_n_builds`).
  #
  # It depends on `test-x64` and `test-azurite` (the only coverage producers;
  # `test-azure` uploads none). The `!cancelled()` status function lets
  # it run even when `test-azurite` is skipped - without a status function a skipped
  # dependency would skip this job too. It releases notifications only when every expected
  # upload actually landed: `test-x64` must have succeeded, and `test-azurite` must have
  # either succeeded (its azure upload landed) or been skipped (cargo-bench-history not
  # affected, so no azure upload was expected). If `test-x64` failed, or `test-azurite`
  # ran and failed, an expected upload is missing and the build is already red - so we do
  # NOT release a status off an incomplete set, which would post the very "coverage
  # decreased" result this gate exists to prevent. A `skip_all` run uploads no coverage at
  # all, so `test-x64` is skipped and this job does not run - and so does a run whose scope
  # holds no instrumented code, where `test-x64` succeeds but produces no report to upload.
  #
  # Like the upload jobs, this runs for fork PRs too: the token is empty there and the
  # action falls back to tokenless notification (this is a public repository), so
  # external-contributor PRs get the same gated, complete-data coverage status.
  coverage-notify:
    needs: [test-x64, test-azurite]
    if: >-
      !cancelled()
      && needs.test-x64.result == 'success'
      && needs.test-x64.outputs.coverage_report == 'true'
      && (needs.test-azurite.result == 'success' || needs.test-azurite.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Release Codecov coverage notifications
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true

  # Fan-in for merge-blocking Standard validation jobs. GitHub's required-checks field is a string
  # match on this job's name, so matrix legs that never ran cannot be listed there.
  # Succeeds when every dependency succeeded, or skipped if that job is allowed to skip;
  # fails on failure, cancelled, or any other result. Advisory jobs (`coverage-notify`)
  # and `alert` stay off this list. When adding a merge-blocking job, add it here - never
  # to the GitHub ruleset. Unconditional gates also go on MUST_SUCCEED_JOBS below.
  required-checks:
    # Matrix names never become independent ruleset targets.
    # Ref: .github/workflows/implementation.md#merge-blocking-result.
    name: required-checks
    if: always()
    needs:
      - prepare
      - test-scripts
      - validate-workflows
      - benchmark-canary
      - validate-versions
      - clippy-dev-docs
      - test-x64
      - test-azurite
      - test-azure
    runs-on: ubuntu-latest
    steps:
      # No setup-environment: this job only classifies `needs` results. Installing the
      # toolchain after every Standard validation run would add work for no benefit. PowerShell is
      # preinstalled on ubuntu-latest; the module comes from the checkout.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Evaluate merge-blocking jobs
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MUST_SUCCEED_JOBS: prepare validate-versions
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          Import-Module ./scripts/build/RequiredChecks.psm1 -Force
          $mustSucceed = @($env:MUST_SUCCEED_JOBS -split '\s+' | Where-Object { $_ })
          Assert-RequiredCheck -NeedsJson $env:NEEDS_JSON -MustSucceedJob $mustSucceed

  # File a GitHub issue whenever any job above fails on a push to `main`, so a push-to-main
  # failure is tracked rather than lost. PR runs surface a failure as the red check and need
  # no issue. Main pushes validate the full workspace without PR change selection.
  #
  # A fresh issue is filed per failing run - no dedup, no auto-close - mirroring the release
  # workflow's per-run alert: each failure is investigated and closed individually, and a
  # later green run does not touch prior issues. `failure()` fires only on a real failure, so
  # a fully-green (or skipped-only) run files nothing. `needs` lists every merge-blocking and
  # advisory job directly, so a failure in any of them reaches this gate. `required-checks` is
  # deliberately NOT among them: it converts a cancelled dependency into a failure, so
  # depending on it would turn a cancelled push-to-main run into a filed issue about a failure
  # that never happened. `alert` also stays off the fan-in's own `needs:` - it files issues,
  # it is not a merge gate.
  alert:
    # Ref: .github/workflows/design.md#failure-alerting.
    needs:
      - prepare
      - test-scripts
      - validate-workflows
      - benchmark-canary
      - validate-versions
      - clippy-dev-docs
      - test-x64
      - test-azurite
      - test-azure
      - coverage-notify
    # Scheduled callers use their own combined standard/deep failure reporter, not a second issue.
    # Ref: .github/workflows/implementation.md#scheduled-standard-validation.
    if: failure() && github.event_name == 'push' && github.repository == 'folo-rs/folo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      issues: write

    steps:
      - name: Open failure issue for this run
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          # Ensure the shared label exists (idempotent) so `gh issue create` cannot fail on a
          # missing label.
          $PSNativeCommandUseErrorActionPreference = $false
          gh label create ci-failure --color B60205 --description "CI workflow failure" --force *> $null
          $PSNativeCommandUseErrorActionPreference = $true

          $body = @"
          The Standard validation workflow failed on a push to ``main``.

          Push-to-``main`` validation checks the full workspace without PR change selection.

          Failed run: $env:RUN_URL
          "@
          gh issue create --label ci-failure --title "Standard validation workflow failed (run $env:RUN_ID)" --body $body

name: Copilot Setup Steps

# This workflow sets up the development environment for GitHub Copilot coding agent.
# See https://docs.github.com/en/copilot/how-tos/agents/copilot-coding-agent/customizing-the-development-environment-for-copilot-coding-agent
on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
    - .github/workflows/copilot-setup-steps.yml

# This controls standalone setup-validation runs from the triggers above, not Copilot sessions.
# The workflow name isolates these runs from code-review setup. PR numbers distinguish
# same-named branches in different forks; ref covers pushes and manual dispatches.
# A new run cancels older validation work in the same group so superseded checks do not
# keep consuming a runner.
# See .github/workflows/design.md#concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Setup environment
      # This workflow only prepares tools; workspace compilation belongs to the agent's work.
      # Ref: implementation.md#shared-environment-cache-identity.
      uses: ./.github/actions/setup-environment
      with:
        save-build-cache: "false"
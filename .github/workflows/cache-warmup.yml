name: Cache warmup

# Populates the shared development environment on the default branch and refreshes cache use.
# The shared composite owns toolchain preparation and cache inputs for warmup and consumers.
# Cache eviction and image/pin changes still require a supported cold setup.
# Ref: .github/workflows/design.md#cache-warmup.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  warmup:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm, windows-11-arm]
        # APT keys include the requested package set. Warm both Linux variants without
        # duplicating non-Linux jobs, where the Valgrind input does not affect setup.
        # Ref: .github/workflows/implementation.md#shared-environment-cache-identity.
        install-valgrind: ["false"]
        include:
          - platform: ubuntu-latest
            install-valgrind: "true"
          - platform: ubuntu-24.04-arm
            install-valgrind: "true"

    runs-on: ${{ matrix.platform }}
    # This job's whole purpose is the cold-cache setup-environment, which can take up to
    # ~90 min; keep margin over that so a slightly-slower-than-usual warmup is not killed.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment
        # Use the consumers' complete toolchain set and normalized cache inputs, not a
        # warmup-specific environment. Prime each declared APT package-set variant.
        # Ref: .github/workflows/implementation.md#shared-environment-cache-identity.
        uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "false"
          install-valgrind: ${{ matrix.install-valgrind }}

name: Benchmark history backfill

# Folo supplies the schedule and window parameters; shared Rust calculates the frozen range.
# Ref: design.md#nightly-history-backfill and implementation.md#benchmark-backfill-caller.
on:
  schedule:
    # 02:00 UTC, deliberately off the cache-warmup workflow's midnight slot so the two multi-hour
    # nightly jobs do not compete for the same runner-concurrency budget.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      # Optional escape hatch: the ref to use as the range END instead of the computed one (the
      # newest commit at least 24 hours old). A commit that fails slowly is re-selected every night
      # and can eat a whole run before anything is stored, so this lets an operator step over it by
      # aiming the window at an older commit. Leave empty for a normal run.
      to_commit:
        description: Commit ref to backfill up to (leave empty for the newest commit at least 24 hours old)
        required: false
        type: string
        default: ''

# Serialize Folo's scheduled and manual invocations without cancelling work already in progress.
# This caller-wide group is distinct from the shared workflow's run and project/platform queues.
# Ref: design.md#nightly-history-backfill.
concurrency:
  group: bench-history-backfill
  cancel-in-progress: false

permissions: {}

jobs:
  backfill:
    # The production identity trusts this repository's main branch, not forks or feature dispatches.
    if: github.repository == 'folo-rs/folo' && github.ref == 'refs/heads/main'
    uses: folo-rs/cargo-bench-history-action/.github/workflows/backfill.yml@946d16f19c575f29d3ae43cbc8d2369d4911c090 # v1.1.0 candidate
    permissions:
      contents: read
      id-token: write
    with:
      azure-client-id: ${{ vars.AZURE_PROD_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      lookback: 14 days
      minimum-age: 24 hours
      to: ${{ inputs.to_commit }}
      exclude: benchmarks,infinity_pool
      all-features: true
      best-of: 3
      # Ref: design.md#benchmark-setup-hook.
      rustflags: -Cllvm-args=-align-all-functions=6
      # Folo opts into per-commit continuation and whole-job best effort at the hosted ceiling.
      # The generic flow keeps failures visible unless a caller opts in.
      # Ref: design.md#nightly-history-backfill.
      ignore-errors: true
      best-effort: true
      install-method: path
      source-path: .

name: Release

# The caller filename is part of Folo's crates.io Trusted Publisher registration.
# Shared workflows own publication, reconciliation, native batches and failure reporting.
# Ref: .github/workflows/implementation.md#release-publication.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Optional full original source SHA for recovery after artifacts expire
        type: string
        default: ''
      verify-publishing-identity:
        description: Exchange and revoke an OIDC credential without publishing
        type: boolean
        default: false

# Retain the outer publisher lock while earlier runs drain. The shared graph's
# workspace-scoped inner lock has a distinct name, so it cannot wait on this caller.
# Ref: .github/workflows/design.md#publication-and-recovery.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  verify-publishing-identity:
    if: github.event_name == 'workflow_dispatch' && inputs.verify-publishing-identity && github.repository == 'folo-rs/folo' && github.ref == 'refs/heads/main'
    # This route never starts the publisher; credentials are exchanged and revoked only.
    # Ref: design.md#publication-identity-verification.
    uses: folo-rs/cargo-release-plan-action/.github/workflows/identity-probe.yml@97ee0b1902dc011bb230b056e38c3bf647ddc558
    with:
      install-method: path
      source-path: .
    permissions:
      contents: read
      actions: read
      id-token: write

  publish:
    if: github.repository == 'folo-rs/folo' && github.ref == 'refs/heads/main' && !inputs.verify-publishing-identity
    uses: folo-rs/cargo-release-plan-action/.github/workflows/release.yml@97ee0b1902dc011bb230b056e38c3bf647ddc558
    with:
      install-method: path
      # Controller code always comes from the invocation checkout. Recovery selects
      # a separate immutable publication source, never a different automation revision.
      # Ref: implementation.md#release-publication.
      source-path: .
      source: ${{ inputs.source || '' }}
    permissions:
      contents: write
      issues: write
      actions: read
      id-token: write

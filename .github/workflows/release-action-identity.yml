name: Release action identity

# Proves the external workflow can resolve its own immutable action source using
# only the caller run's read permissions, independently of the caller checkout.
# Ref: packages/cargo-release-plan/docs/design.md#consumption-and-configuration.
on:
  pull_request:
    paths:
      - .github/workflows/release-action-identity.yml
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  release-check:
    # Exercise the complete public read-only check graph against Folo source and configuration.
    # Ref: packages/cargo-release-plan/docs/design.md#consumption-and-configuration.
    uses: folo-rs/cargo-release-plan-action/.github/workflows/check.yml@512ff6afc7e101f21243b15ed7dbedddc2ac052d
    with:
      install-method: path
      source-path: .

  identity:
    uses: folo-rs/cargo-release-plan-action/.github/workflows/identity.yml@512ff6afc7e101f21243b15ed7dbedddc2ac052d
    with:
      expected-sha: 512ff6afc7e101f21243b15ed7dbedddc2ac052d

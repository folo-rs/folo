name: Release action identity

# Source-mode bootstrap checks while release.yml selects the legacy publisher.
# The standard shared check replaces this canary at operational cutover.
# Ref: .github/workflows/implementation.md#release-action-bootstrap-check.
on:
  pull_request:
    paths:
      - .github/workflows/release-action-identity.yml
      - .github/workflows/release.yml
      - .github/actions/setup-environment/**
      - .github/actions/release-plan-setup/**
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - constants.env
      - packages/cargo-release-plan/**
      - packages/crp_*/**
      - scripts/setup/**
  workflow_dispatch: {}

# Superseded PR checks provide no readiness evidence; explicit dispatches remain independent.
# Ref: .github/workflows/implementation.md#release-action-bootstrap-check.
concurrency:
  group: release-action-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  release-check:
    # Exercise the complete public read-only check graph against Folo source and configuration.
    # Ref: packages/cargo-release-plan/docs/design.md#consumption-and-configuration.
    uses: folo-rs/cargo-release-plan-action/.github/workflows/check.yml@0a3faead9f7ee91b2702ee7d8847bb04100f23c7
    with:
      install-method: path
      source-path: .

  identity:
    uses: folo-rs/cargo-release-plan-action/.github/workflows/identity.yml@0a3faead9f7ee91b2702ee7d8847bb04100f23c7
    with:
      expected-sha: 0a3faead9f7ee91b2702ee7d8847bb04100f23c7

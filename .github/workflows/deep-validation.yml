name: Deep validation

on:
  schedule:
    # Avoid contention with morning work; see design.md#scheduled-validation.
    - cron: 0 18 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    # Scheduled and manual runs validate merged main, never a PR or fork.
    # Ref: .github/workflows/design.md#scheduled-validation.
    if: github.repository == 'folo-rs/folo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Plan the full deep-check matrix
        id: plan
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module ./scripts/scheduled/ScheduledPlan.psm1 -Force
          $matrix = @{ include = @(Get-ScheduledCheck) } | ConvertTo-Json -Depth 10 -Compress
          "matrix=$matrix" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

  # Reuse every standard check at the same main commit, with no PR/delta pruning.
  # The caller grants the permissions required by Azure tests and the reusable workflow's
  # push-only alert job; this workflow's report job owns scheduled failure publication.
  # Ref: .github/workflows/implementation.md#scheduled-standard-validation.
  standard:
    needs: plan
    uses: ./.github/workflows/standard-validation.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      issues: write
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  checks:
    needs: plan
    name: ${{ matrix.id }}
    # Independent checks continue after a failure, preserving the full nightly scope.
    # Ref: .github/workflows/design.md#failure-diagnostics.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    # Allow for mutation work per shard plus cold-cache environment setup.
    # Ref: .github/workflows/implementation.md#deep-execution.
    timeout-minutes: 360
    # Live captures and native artifacts must stay outside mutation source copies.
    # Capture and always-upload share this path. Ref: implementation.md#deep-execution.
    env:
      SCHEDULED_OUTPUT_NAME: scheduled-result
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        # Mutation builds use private source copies rather than this checkout's target directory.
        # Ref: implementation.md#shared-environment-cache-identity.
        with:
          save-build-cache: ${{ matrix.recipe != 'mutants' }}
      - name: Run just ${{ matrix.recipe }}
        shell: pwsh
        env:
          SCHEDULED_CHECK: ${{ toJSON(matrix) }}
          # Plain output keeps captured diagnostic excerpts readable without changing check behavior.
          NO_COLOR: "1"
          CARGO_TERM_COLOR: never
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/scheduled/Invoke-ScheduledCheck.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP $env:SCHEDULED_OUTPUT_NAME)
          exit $LASTEXITCODE
      - name: Preserve readable diagnostics
        # Setup failures have job logs but may never reach the summary-writing check.
        # Ref: .github/workflows/implementation.md#failure-reporting.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ runner.temp }}/${{ env.SCHEDULED_OUTPUT_NAME }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # Low-yield checks run at full workspace scope after the main-only plan gate.
  # Ref: .github/workflows/design.md#shallow-and-deep-validation.
  build-release:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        id: setup
        with:
          save-build-cache: "true"
      # Keep independent findings visible without running checks after failed setup or cancellation.
      # Ref: .github/workflows/design.md#job-granularity-and-gating.
      - name: Run clippy release on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just clippy release

      - name: Run build release on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just build release

  run-examples:
    needs: plan
    # Work budget (~90 min) plus up to 90 min for a cold-cache setup-environment.
    timeout-minutes: 180
    env:
      RUST_BACKTRACE: "1"
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "true"
      - name: Run examples on ${{ matrix.platform }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just run-examples

  # Default features check is platform-agnostic, so run only on Ubuntu for efficiency.
  default-features-check:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "true"
      - name: Run default-features-check
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just default-features-check

  hack:
    needs: plan
    # Work budget (~90 min) plus up to 90 min for a cold-cache setup-environment.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          save-build-cache: "true"
      - name: Run hack on ${{ matrix.platform }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just hack

  machete:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # macOS is excluded because maintainers lack a local PC for dependency trial and error.
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        # The recipe also runs cargo-udeps, which compiles the workspace.
        with:
          save-build-cache: "true"
      - name: Run machete on ${{ matrix.platform }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just machete

  # ARM64 exercises architecture-gated paths and supplies the MSRV runtime pass.
  # macOS belongs here because its hosted runner is Apple Silicon.
  # Ref: .github/workflows/design.md#platform-strategy.
  test-arm:
    needs: plan
    # Preserve panic diagnostics in job logs used by the failure reporter.
    # Ref: .github/workflows/design.md#failure-diagnostics.
    env:
      RUST_BACKTRACE: "1"
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04-arm, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        id: setup
        # Linux benchmark smoke tests execute Gungraun harnesses under Valgrind.
        with:
          save-build-cache: "true"
          install-valgrind: "true"
      - name: Run tests on ${{ matrix.platform }}
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just test
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/default/junit.xml
          flags: ${{ matrix.platform }}
          report_type: test_results
      - name: Run benchmark targets on ${{ matrix.platform }}
        # A test or upload failure must not hide benchmark failures.
        # Ref: .github/workflows/design.md#job-granularity-and-gating.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          just test-benches

  report:
    # This is a normal failure-reporting job in the same run, including planning/setup failures.
    # Ref: .github/workflows/implementation.md#failure-reporting.
    needs: [plan, standard, checks, build-release, run-examples, default-features-check, hack, machete, test-arm]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: File the failure report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/scheduled/Invoke-ScheduledReport.ps1
      - name: Preserve reporting diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scheduled-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scheduled-report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

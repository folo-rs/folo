name: Benchmark history

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  benchmark:
    # Folo supplies configuration only; shared Rust owns preparation and flag composition.
    # Ref: implementation.md#benchmark-workflow-artifacts.
    if: github.repository == 'folo-rs/folo' && github.ref == 'refs/heads/main'
    # The reviewed implementation owns deduplication/queues; source mode tests the
    # monorepo's pending tool implementation. Ref: implementation.md#benchmark-workflow-artifacts.
    uses: folo-rs/cargo-bench-history-action/.github/workflows/history.yml@36da42dd15209824627745c3efd78495cec035f2 # v1.1.0
    permissions:
      contents: read
      actions: read
      id-token: write
      issues: write
    with:
      azure-client-id: ${{ vars.AZURE_PROD_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      exclude: benchmarks,infinity_pool
      all-features: true
      best-of: 3
      # Keep relink-sensitive timings comparable across history, PR and backfill.
      # Ref: design.md#benchmark-setup-hook.
      rustflags: -Cllvm-args=-align-all-functions=6
      install-method: path
      source-path: .

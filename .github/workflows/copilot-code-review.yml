name: Copilot Code Review

# Keep review setup independent of coding-agent tooling to minimize startup cost.
# See .github/workflows/design.md#copilot-agent-environments.
on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
    - .github/workflows/copilot-code-review.yml

# This controls standalone setup-validation runs from the triggers above, not Copilot reviews.
# The workflow name isolates these runs from coding-agent setup. PR numbers distinguish
# same-named branches in different forks; ref covers pushes and manual dispatches.
# A new run cancels older validation work in the same group so superseded checks do not
# keep consuming a runner.
# See .github/workflows/design.md#concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Copilot requires this job ID even in the review-specific workflow.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

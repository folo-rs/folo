name: Copilot Code Review

# Keep review setup independent of coding-agent tooling to minimize startup cost.
# See .github/workflows/design.md#copilot-agent-environments.
on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - .github/workflows/copilot-code-review.yml
  pull_request:
    paths:
    - .github/workflows/copilot-code-review.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Copilot requires this job ID even in the review-specific workflow.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

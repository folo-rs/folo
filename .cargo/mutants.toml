# No reason to skip anything - full feature coverage, please.
all_features = true

# We have mutation-optimized settings that speed up the builds a lot.
profile = "mutants"

additional_cargo_args = [
    # avoid spending time on Cargo package manager activity during mutation testing - we use the packages in the lockfile.
    "--locked",
    # Cargo library unit tests are the mutation-testing boundary. Apply this to
    # both the build and test phases so integration targets are neither compiled nor run.
    # Ref: docs/testing.md, "Mutation testing target selection".
    "--lib"
]

exclude_re = [
    # We typically do not have any API contract for what we expose as human-readable output.
    "impl Debug",
    "impl fmt::Debug",
    "impl std::fmt::Debug",

    # Equivalent mutants: significance gates compare a p-value against a fixed alpha
    # with strict `<`. Turning `<` into `<=` only changes behaviour when the p-value
    # equals alpha exactly, which never occurs for the statistics that feed these gates
    # (Mann-Whitney U and Mann-Kendall). No
    # production series lands a p-value bit-for-bit on 0.05, so the boundary direction is
    # unobservable. Catching it would require a fixture engineered to sit exactly on alpha - a
    # non-production scenario the deleted AnalysisConfig used to fabricate by setting alpha to the
    # fixture's own p-value. Only the `<=` variant is excluded; the `==` and `>` mutants at the
    # same sites remain caught. Ref: docs/testing.md, "Mutation testing coverage and skipping
    # mutations".
    'packages/cbh_detect/src/detect/(findings|branch)\.rs:\d+:\d+: replace < with <= in (evaluate_change_point|evaluate_drift|regime_is_stable)',

    # Equivalent mutants: these short-circuits only avoid redundant family work.
    # An empty member bitset reaches the immediately following empty-iterator return;
    # a smaller family is rejected by `family_is_better`; and a repeated member bitset
    # reconstructs the same family and is rejected there too. Replacing either `||`
    # with `&&` changes the amount of work but not the selected family.
    'packages/cbh_detect/src/detect/branch\.rs:\d+:\d+: replace \|\| with && in consider_family_seed',

    # Equivalent: hexadecimal parsing bounds each nibble to disjoint bits after
    # shifting the high nibble, so OR and XOR produce the same byte for every input.
    # Keep the AND replacement and all parsing/validation mutations enabled.
    'packages/crp_workspace/src/manifest\.rs:\d+:\d+: replace \| with \^ in decode_git_reference',

    # Without failure publication, accepted tasks in another region never resolve.
    'packages/vicinal/src/pool_runtime\.rs:\d+:\d+: replace PoolRuntime::fail with \(\)$',

    # Shutdown must drop a queued capture before waiting for the worker it releases.
    # Skipping either drain strands that initializer; keep non-no-op mutations enabled.
    'packages/vicinal/src/pool_runtime\.rs:\d+:\d+: replace (PoolRuntime::drain_groups|drain_queue) with \(\)$',

    # Reporting shutdown before startup prevents eager workers from reaching their
    # parked-worker hooks, stranding fixtures such as eager spawn refusal.
    'packages/vicinal/src/pool_runtime\.rs:\d+:\d+: replace PoolRuntime::is_shutdown -> bool with true$',

    # Empty worker entries never reach participation or the worker loop. Startup and task
    # waiters then have no worker to release them, and the mutation watchdog is disabled.
    'packages/vicinal/src/worker\.rs:\d+:\d+: replace Worker::(run|run_with) with \(\)$',
    'packages/vicinal/src/worker_group\.rs:\d+:\d+: replace WorkerGroup::(execute_worker|run_worker) with \(\)$',

    # Initialization must complete the binding target before entering the worker loop:
    # teardown cannot start while the builder still waits. Abandoning a reservation must
    # complete the same target even though no worker will start.
    'packages/vicinal/src/worker\.rs:\d+:\d+: replace BindingReservation::(initialize|complete) with \(\)$',
    'packages/vicinal/src/worker\.rs:\d+:\d+: replace <impl Drop for BindingReservation>::drop with \(\)$',

    # Without the exit accounting, teardown waits for participation that was never released.
    "packages/vicinal/src/worker_group\\.rs:\\d+:\\d+: replace <impl Drop for WorkerExitGuard<'_>>::drop with \\(\\)$",

    # Fixtures wait for signals sent by the initializer; omitting it leaves them blocked
    # with the mutation watchdog disabled. Keep other replacements enabled.
    'packages/vicinal/src/pool_runtime\.rs:\d+:\d+: replace PoolRuntime::thread_init -> Option<Arc<ThreadInit>> with None$',
]
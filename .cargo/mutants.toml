# No reason to skip anything - full feature coverage, please.
all_features = true

# We have mutation-optimized settings that speed up the builds a lot.
profile = "mutants"

additional_cargo_args = [
    # avoid spending time on Cargo package manager activity during mutation testing - we use the packages in the lockfile.
    "--locked"
]

# Only run unit tests and integration tests, not doctests because doctests are slow (even after
# the recent speedups - they are slow when they fail, and they will fail a lot under mutation, so
# are not really worth using in mutation testing). Likewise, we do not specify benchmarks here
# because they can have nontrivial overhead due to benchmark harness setup and are rarely doing
# something that is not already covered by unit tests or integration tests.
additional_cargo_test_args = [ "--tests" ]

exclude_re = [
    # We typically do not have any API contract for what we expose as human-readable output.
    "impl Debug",
    "impl fmt::Debug",
    "impl std::fmt::Debug",

    # Equivalent mutants: the significance gates of the three cbh_detect detectors compare a
    # p-value against a fixed alpha with strict `<`. Turning `<` into `<=` only changes behaviour
    # when the p-value equals alpha exactly, which never occurs for the continuous statistics that
    # feed these gates (Mann-Whitney U, Mann-Kendall, and the prediction-interval Student t). No
    # production series lands a p-value bit-for-bit on 0.05, so the boundary direction is
    # unobservable. Catching it would require a fixture engineered to sit exactly on alpha - a
    # non-production scenario the deleted AnalysisConfig used to fabricate by setting alpha to the
    # fixture's own p-value. Only the `<=` variant is excluded; the `==` and `>` mutants at the
    # same sites remain caught. Ref: docs/testing.md, "Mutation testing coverage and skipping
    # mutations".
    'packages/cbh_detect/src/detect/findings\.rs:\d+:\d+: replace < with <= in (evaluate_change_point|evaluate_drift|compare_branch_levels)',
]
# No reason to skip anything - full feature coverage, please.
all_features = true

# We have mutation-optimized settings that speed up the builds a lot.
profile = "mutants"

additional_cargo_args = [
    # avoid spending time on Cargo package manager activity during mutation testing - we use the packages in the lockfile.
    "--locked"
]

# Only run unit tests and integration tests, not doctests because doctests are slow (even after
# the recent speedups - they are slow when they fail, and they will fail a lot under mutation, so
# are not really worth using in mutation testing). Likewise, we do not specify benchmarks here
# because they can have nontrivial overhead due to benchmark harness setup and are rarely doing
# something that is not already covered by unit tests or integration tests.
additional_cargo_test_args = [ "--tests" ]

exclude_re = [
    # We typically do not have any API contract for what we expose as human-readable output.
    "impl Debug",
    "impl fmt::Debug",
    "impl std::fmt::Debug",

    # Equivalent mutants: significance gates compare a p-value against a fixed alpha
    # with strict `<`. Turning `<` into `<=` only changes behaviour when the p-value
    # equals alpha exactly, which never occurs for the statistics that feed these gates
    # (Mann-Whitney U and Mann-Kendall). No
    # production series lands a p-value bit-for-bit on 0.05, so the boundary direction is
    # unobservable. Catching it would require a fixture engineered to sit exactly on alpha - a
    # non-production scenario the deleted AnalysisConfig used to fabricate by setting alpha to the
    # fixture's own p-value. Only the `<=` variant is excluded; the `==` and `>` mutants at the
    # same sites remain caught. Ref: docs/testing.md, "Mutation testing coverage and skipping
    # mutations".
    'packages/cbh_detect/src/detect/(findings|branch)\.rs:\d+:\d+: replace < with <= in (evaluate_change_point|evaluate_drift|regime_is_stable)',

    # Equivalent mutants: these short-circuits only avoid redundant family work.
    # An empty member bitset reaches the immediately following empty-iterator return;
    # a smaller family is rejected by `family_is_better`; and a repeated member bitset
    # reconstructs the same family and is rejected there too. Replacing either `||`
    # with `&&` changes the amount of work but not the selected family.
    'packages/cbh_detect/src/detect/branch\.rs:\d+:\d+: replace \|\| with && in consider_family_seed',

    # Unreachable mutant: `dure` is a Windows-only tool whose non-Windows entry point is a
    # stub reporting the unsupported platform (dure/docs/implementation.md, "Platform gate").
    # Mutation testing runs on Windows, where `cfg(not(windows))` code is never compiled, so no
    # test can observe this mutation. The site cannot carry `mutants::skip` instead: the
    # `mutants` dev-dependency is itself Windows-only, so naming the attribute there would break
    # the non-Windows build that is the only one compiling the stub.
    'packages/dure/src/main\.rs:\d+:\d+: replace main -> std::process::ExitCode with Default::default\(\)',
]
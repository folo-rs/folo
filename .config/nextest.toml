[profile.default]
# The leak detector is just bad and calls everything a leaky test because it relies on timing
# coincidences to do its job. It is not an accurate nor valuable feature and we would rather
# disable it but there is no off button so let's just set a high timeout that avoids it complaining.
leak-timeout = "10s"

[profile.default.junit]
path = "junit.xml"

# Nextest selects this profile automatically under Miri, including for `just miri`.
# Enforce the workload budget in docs/testing.md without imposing a wall-clock
# deadline on native or mutation tests. Slow tests fail rather than passing on timeout.
[profile.default-miri]
slow-timeout = { period = "10s", terminate-after = 6, grace-period = "0s" }

# These end-to-end tests each nest child processes inside pseudoconsoles.
# Letting them overlap under coverage can starve console-host progress long
# enough to hit the last-chance watchdog, so they share one execution slot.
[test-groups]
dure-windows-conpty = { max-threads = 1 }
# Real Git/Cargo cases share one Windows slot across nextest processes. The integration
# module also serializes libtest threads. See packages/cargo-release-plan/docs/implementation.md.
release-candidate-windows = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(dure) & binary(windows)'
test-group = 'dure-windows-conpty'

[[profile.default.overrides]]
filter = 'package(crp_impl) & binary(boundaries) & test(candidate::)'
platform = 'cfg(windows)'
test-group = 'release-candidate-windows'

# The one true end-to-end test (packages/cargo-bench-history/tests/cbh_real_engine.rs) runs a
# real `cargo bench` in an isolated throwaway fixture that must resolve `criterion` from
# crates.io, so a transient crates.io DNS/network blip on the runner fails it through no fault
# of the code (issue #324). Retry it a couple of times with a generous backoff so even a
# minutes-long outage is absorbed rather than failing the whole run — this exceptional single
# test is worth waiting on. Scoped narrowly to this test by exact name: it is the only test
# that touches the network for dependency resolution — every other test is hermetic (mock
# engine, in-memory fakes, or plain TOML-text parsing), and those must keep the default
# no-retry policy so genuine flakiness stays visible instead of being masked.
[[profile.default.overrides]]
filter = 'test(=collect_against_real_criterion_bench_stores_wall_time)'
retries = { backoff = "exponential", count = 2, delay = "2m", jitter = true }

# These tests observe how the hardware appears to a process that the operating system has
# narrowed, which is only reachable on a machine that has enough processors (and, on Windows,
# only one processor group) to narrow in the first place. A machine that does not qualify makes
# them skip themselves at run time and report why on stderr. The test runner hides the output of
# a passing test, which would make a machine where they silently stopped testing anything look
# exactly like one where they still do, so their output is surfaced in the run summary.
[[profile.default.overrides]]
filter = """
test(=narrowed_affinity_reveals_sparse_processor_ids) \
+ test(=job_affinity_limit_reveals_sparse_processor_ids) \
+ test(=obeys_processor_selection_limits)"""
success-output = "final"
